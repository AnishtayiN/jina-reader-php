<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jina Reader - تبدیل صفحه وب به Markdown</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Vazirmatn', Tahoma, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 2rem 1rem;
            color: #333;
        }
        .container { max-width: 900px; margin: 0 auto; }
        h1 { color: #fff; text-align: center; font-size: 2.5rem; margin-bottom: 0.5rem; }
        .subtitle { color: rgba(255,255,255,0.85); text-align: center; margin-bottom: 2rem; font-size: 1.1rem; }
        .card {
            background: #fff;
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
            margin-bottom: 1.5rem;
        }
        .input-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 0.5rem; font-weight: 600; }
        input[type="url"] {
            width: 100%;
            padding: 0.85rem 1rem;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1rem;
            direction: ltr;
            text-align: left;
            font-family: inherit;
        }
        input[type="url"]:focus { outline: none; border-color: #667eea; }
        .btn {
            width: 100%;
            padding: 0.9rem;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }
        .btn:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 5px 15px rgba(102,126,234,0.4); }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        #loading { display: none; text-align: center; padding: 2rem; color: #fff; }
        #loading.active { display: block; }
        .spinner {
            width: 40px; height: 40px;
            border: 4px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 1rem;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        #output { display: none; }
        #output.active { display: block; }
        .output-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            padding-bottom: 0.75rem;
            border-bottom: 2px solid #f0f0f0;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .toolbar { display: flex; gap: 0.5rem; flex-wrap: wrap; }
        .copy-btn, .download-btn {
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            font-family: inherit;
            transition: all 0.2s;
        }
        .copy-btn { background: #28a745; color: #fff; }
        .copy-btn:hover { background: #218838; }
        .download-btn { background: #007bff; color: #fff; }
        .download-btn:hover { background: #0056b3; }
        pre {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 1.5rem;
            border-radius: 10px;
            overflow-x: auto;
            font-size: 0.88rem;
            line-height: 1.6;
            direction: ltr;
            text-align: left;
            max-height: 600px;
            overflow-y: auto;
            font-family: 'Fira Code', 'Courier New', monospace;
        }
        .error {
            background: #ffe0e0;
            color: #c00;
            padding: 1rem;
            border-radius: 10px;
            margin-top: 1rem;
            display: none;
        }
        .error.active { display: block; }
        footer {
            text-align: center;
            color: rgba(255,255,255,0.75);
            margin-top: 2rem;
            font-size: 0.9rem;
        }
        footer a { color: #fff; text-decoration: none; border-bottom: 1px dotted rgba(255,255,255,0.5); }
        @media (max-width: 600px) {
            h1 { font-size: 1.8rem; }
            .card { padding: 1.5rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📖 Jina Reader</h1>
        <p class="subtitle">هر صفحه وب را به Markdown تمیز تبدیل کنید — بدون نیاز به سرور</p>

        <div class="card">
            <form id="readerForm">
                <div class="input-group">
                    <label for="urlInput">🔗 آدرس صفحه:</label>
                    <input type="url" id="urlInput" placeholder="https://example.com/article" required>
                </div>
                <button type="submit" class="btn" id="submitBtn">🚀 تبدیل به Markdown</button>
            </form>
            <div class="error" id="errorBox"></div>
        </div>

        <div id="loading">
            <div class="spinner"></div>
            <p>در حال دریافت و تبدیل صفحه...</p>
        </div>

        <div id="output">
            <div class="card">
                <div class="output-header">
                    <h2>📤 خروجی Markdown</h2>
                    <div class="toolbar">
                        <button class="copy-btn" id="copyBtn">📋 کپی</button>
                        <button class="download-btn" id="downloadBtn">⬇️ دانلود</button>
                    </div>
                </div>
                <pre id="markdownOutput"></pre>
            </div>
        </div>

        <footer>
            ساخته شده با ❤️ | قدرت گرفته از <a href="https://jina.ai/reader" target="_blank">Jina AI Reader</a>
        </footer>
    </div>

    <script>
        const form = document.getElementById("readerForm");
        const urlInput = document.getElementById("urlInput");
        const submitBtn = document.getElementById("submitBtn");
        const loading = document.getElementById("loading");
        const output = document.getElementById("output");
        const markdownOutput = document.getElementById("markdownOutput");
        const copyBtn = document.getElementById("copyBtn");
        const downloadBtn = document.getElementById("downloadBtn");
        const errorBox = document.getElementById("errorBox");

        form.addEventListener("submit", async (e) => {
            e.preventDefault();
            const url = urlInput.value.trim();
            if (!url) return;

            errorBox.classList.remove("active");
            output.classList.remove("active");
            loading.classList.add("active");
            submitBtn.disabled = true;

            try {
                const response = await fetch("https://r.jina.ai/" + url, {
                    headers: { "Accept": "text/markdown", "X-Return-Format": "markdown" }
                });
                if (!response.ok) throw new Error("خطای سرور: " + response.status);
                const markdown = await response.text();
                markdownOutput.textContent = markdown;
                output.classList.add("active");
            } catch (err) {
                errorBox.textContent = "❌ " + (err.message || "خطایی رخ داد");
                errorBox.classList.add("active");
            } finally {
                loading.classList.remove("active");
                submitBtn.disabled = false;
            }
        });

        copyBtn.addEventListener("click", async () => {
            try {
                await navigator.clipboard.writeText(markdownOutput.textContent);
                const original = copyBtn.textContent;
                copyBtn.textContent = "✅ کپی شد!";
                setTimeout(() => { copyBtn.textContent = original; }, 2000);
            } catch (e) {
                copyBtn.textContent = "❌ خطا";
            }
        });

        downloadBtn.addEventListener("click", () => {
            const text = markdownOutput.textContent;
            const blob = new Blob([text], { type: 'text/markdown' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'article.md';
            a.click();
            URL.revokeObjectURL(a.href);
        });
    </script>
</body>
</html>
