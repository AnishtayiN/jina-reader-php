<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jina Reader - تبدیل صفحه وب به Markdown</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); min-height: 100vh; color: #e0e0e0; padding: 2rem 1rem; }
        .container { max-width: 900px; margin: 0 auto; }
        h1 { text-align: center; font-size: 2.5rem; margin-bottom: 0.5rem; background: linear-gradient(90deg, #00d2ff, #3a7bd5); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .subtitle { text-align: center; color: #888; margin-bottom: 2rem; }
        .card { background: rgba(255,255,255,0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 2rem; margin-bottom: 1.5rem; }
        label { display: block; margin-bottom: 0.5rem; font-weight: bold; }
        .input-row { display: flex; gap: 0.5rem; }
        input[type="url"] { flex: 1; padding: 0.9rem 1rem; font-size: 1rem; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; color: #fff; direction: ltr; text-align: left; }
        input[type="url"]:focus { outline: none; border-color: #3a7bd5; }
        button { padding: 0.9rem 1.5rem; font-size: 1rem; background: linear-gradient(90deg, #00d2ff, #3a7bd5); color: #fff; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; transition: transform 0.1s; }
        button:hover { transform: translateY(-2px); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .output { background: #0a0a0a; border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 1.5rem; white-space: pre-wrap; word-wrap: break-word; font-family: 'Courier New', monospace; font-size: 0.9rem; color: #b8f2e6; max-height: 600px; overflow-y: auto; direction: ltr; text-align: left; }
        .toolbar { display: flex; gap: 0.5rem; margin-bottom: 0.75rem; flex-wrap: wrap; }
        .toolbar button { padding: 0.5rem 1rem; font-size: 0.85rem; }
        .spinner { display: inline-block; width: 18px; height: 18px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.8s linear infinite; margin-left: 0.5rem; vertical-align: middle; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .examples { margin-top: 1rem; }
        .examples a { color: #00d2ff; text-decoration: none; margin-left: 1rem; cursor: pointer; }
        .examples a:hover { text-decoration: underline; }
        .error { color: #ff6b6b; margin-top: 0.75rem; }
        .stats { color: #888; font-size: 0.85rem; margin-top: 0.5rem; }
        footer { text-align: center; color: #666; margin-top: 2rem; font-size: 0.85rem; }
        footer a { color: #00d2ff; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📖 Jina Reader</h1>
        <p class="subtitle">هر صفحه وب را به Markdown تمیز تبدیل کنید — بدون نیاز به سرور</p>
        <div class="card">
            <label for="url">🔗 آدرس صفحه</label>
            <div class="input-row">
                <input type="url" id="url" placeholder="https://example.com" autofocus>
                <button id="goBtn">تبدیل</button>
            </div>
            <div class="examples">
                نمونه‌ها:
                <a onclick="setUrl('https://en.wikipedia.org/wiki/Persian_literature')">ویکی‌پدیا</a>
                <a onclick="setUrl('https://github.com')">گیت‌هاب</a>
                <a onclick="setUrl('https://news.ycombinator.com')">Hacker News</a>
            </div>
            <div id="error" class="error"></div>
        </div>
        <div class="card" id="resultCard" style="display:none">
            <div class="toolbar">
                <button id="copyBtn">📋 کپی</button>
                <button id="dlBtn">⬇️ دانلود</button>
                <button id="clearBtn">🗑 پاک کردن</button>
            </div>
            <div class="stats" id="stats"></div>
            <pre class="output" id="output"></pre>
        </div>
        <footer>
            قدرت گرفته از <a href="https://jina.ai/reader" target="_blank">Jina AI Reader</a>
            | <a href="https://github.com/AnishtayiN/jina-reader-php" target="_blank">سورس کد</a>
        </footer>
    </div>
    <script>
        const API_BASE = 'https://r.jina.ai/';
        const CORS_PROXY = 'https://api.allorigins.win/raw?url=';
        function setUrl(u) { document.getElementById('url').value = u; document.getElementById('url').focus(); }
        async function tryFetch(url, useProxy) {
            const target = useProxy ? CORS_PROXY + encodeURIComponent(url) : url;
            const resp = await fetch(target, { headers: useProxy ? {} : { 'Accept': 'text/markdown' } });
            if (!resp.ok) throw new Error('HTTP ' + resp.status);
            return await resp.text();
        }
        async function fetchMarkdown() {
            const url = document.getElementById('url').value.trim();
            const errEl = document.getElementById('error');
            const outEl = document.getElementById('output');
            const card = document.getElementById('resultCard');
            const btn = document.getElementById('goBtn');
            const statsEl = document.getElementById('stats');
            errEl.textContent = '';
            if (!url) { errEl.textContent = 'لطفاً یک آدرس وارد کنید'; return; }
            try { new URL(url); } catch { errEl.textContent = 'آدرس معتبر نیست'; return; }
            btn.disabled = true;
            btn.innerHTML = 'در حال تبدیل<span class="spinner"></span>';
            card.style.display = 'block';
            outEl.textContent = 'در حال دریافت صفحه...';
            statsEl.textContent = '';
            const startTime = Date.now();
            try {
                let text;
                try { text = await tryFetch(API_BASE + url, false); }
                catch (e1) { text = await tryFetch(API_BASE + url, true); }
                const elapsed = ((Date.now() - startTime) / 1000).toFixed(1);
                outEl.textContent = text;
                const words = text.split(/\s+/).filter(w => w).length;
                const lines = text.split('\n').length;
                statsEl.textContent = '⚡ ' + elapsed + ' ثانیه | 📝 ' + lines + ' خط | ' + words + ' کلمه';
            } catch (e) {
                outEl.textContent = '❌ خطا در دریافت: ' + e.message + '\n\nممکن است صفحه موردنظر در دسترس نباشد یا بلاک شده باشد.';
                errEl.textContent = 'دریافت ناموفق بود. آدرس دیگری امتحان کنید.';
            } finally { btn.disabled = false; btn.textContent = 'تبدیل'; }
        }
        document.getElementById('goBtn').addEventListener('click', fetchMarkdown);
        document.getElementById('copyBtn').addEventListener('click', function() {
            const text = document.getElementById('output').textContent;
            navigator.clipboard.writeText(text).then(() => {
                this.textContent = '✅ کپی شد!';
                setTimeout(() => this.textContent = '📋 کپی', 1500);
            });
        });
        document.getElementById('dlBtn').addEventListener('click', function() {
            const text = document.getElementById('output').textContent;
            const blob = new Blob([text], { type: 'text/markdown' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob); a.download = 'article.md'; a.click();
        });
        document.getElementById('clearBtn').addEventListener('click', function() {
            document.getElementById('output').textContent = '';
            document.getElementById('resultCard').style.display = 'none';
        });
        document.getElementById('url').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') fetchMarkdown();
        });
    </script>
</body>
</html>
