<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Jina Reader</title><link rel="stylesheet" href="styles.css"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"></head><body><div class="container"><header><div class="logo"><span class="logo-icon">📖</span><h1>Jina Reader</h1></div><p class="subtitle">تبدیل هر صفحه وب به Markdown تمیز و خوانا</p></header><div class="card"><form id="readerForm"><label for="urlInput">آدرس صفحه وب</label><div class="input-group"><input type="url" id="urlInput" placeholder="https://example.com" required autocomplete="url"><button type="submit" id="submitBtn"><span class="btn-text">تبدیل</span><span class="btn-loading" style="display:none"><svg class="spinner" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3" fill="none" stroke-dasharray="31.4 31.4" stroke-linecap="round"/></svg> در حال خواندن...</span></button></div></form></div><div id="resultSection" class="card result-card" style="display:none"><div class="result-header"><h2 id="resultTitle"></h2><div class="result-actions"><button class="action-btn" onclick="copyMarkdown()">📋 کپی</button><button class="action-btn" onclick="downloadMarkdown()">⬇️ دانلود</button></div></div><div class="result-meta"><span id="resultUrl"></span><span id="resultTime"></span></div><div class="markdown-preview" id="markdownOutput"></div><textarea id="rawMarkdown" class="raw-textarea" readonly></textarea></div><div id="errorSection" class="card error-card" style="display:none"><span class="error-icon">⚠️</span><p id="errorMessage"></p></div><footer><p>ساخته شده با ❤️ | قدرت‌گرفته از <a href="https://jina.ai/reader" target="_blank">Jina AI Reader</a></p><p><a href="https://github.com/AnishtayiN/jina-reader-php" target="_blank">📂 سورس‌کد</a></p></footer></div><script>const $=id=>document.getElementById(id);const form=$('readerForm'),urlInput=$('urlInput'),submitBtn=$('submitBtn');const resultSection=$('resultSection'),errorSection=$('errorSection');const resultTitle=$('resultTitle'),resultUrl=$('resultUrl'),resultTime=$('resultTime');const markdownOutput=$('markdownOutput'),rawMarkdown=$('rawMarkdown'),errorMessage=$('errorMessage');function esc(t){const d=document.createElement('div');d.textContent=t;return d.innerHTML;}function render(md){let h=esc(md);h=h.replace(/```(\w*)\n([\s\S]*?)```/g,'<pre><code>$2</code></pre>');h=h.replace(/`([^`]+)`/g,'<code>$1</code>');h=h.replace(/^### (.+)$/gm,'<h3>$1</h3>');h=h.replace(/^## (.+)$/gm,'<h2>$1</h2>');h=h.replace(/^# (.+)$/gm,'<h1>$1</h1>');h=h.replace(/\*\*\*(.+?)\*\*\*/g,'<strong><em>$1</em></strong>');h=h.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');h=h.replace(/\*(.+?)\*/g,'<em>$1</em>');h=h.replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank">$1</a>');h=h.replace(/!\[([^\]]*)\]\(([^)]+)\)/g,'<img src="$2" alt="$1">');h=h.replace(/\n\n+/g,'</p><p>');h=h.replace(/\n/g,'<br>');return '<p>'+h+'</p>';}function setLoading(l){submitBtn.querySelector('.btn-text').style.display=l?'none':'inline';submitBtn.querySelector('.btn-loading').style.display=l?'inline-flex':'none';submitBtn.disabled=l;}function showError(m){resultSection.style.display='none';errorSection.style.display='flex';errorMessage.textContent=m;}function showResult(t,u,md){errorSection.style.display='none';resultSection.style.display='block';resultTitle.textContent=t||'بدون عنوان';resultUrl.textContent='🔗 '+u;resultTime.textContent='🕐 '+new Date().toLocaleString('fa-IR');markdownOutput.innerHTML=render(md);rawMarkdown.value=md;resultSection.scrollIntoView({behavior:'smooth'});}form.addEventListener('submit',async e=>{e.preventDefault();const u=urlInput.value.trim();if(!u)return;setLoading(true);resultSection.style.display='none';errorSection.style.display='none';try{const r=await fetch('https://r.jina.ai/'+u,{headers:{'Accept':'text/markdown','X-Return-Format':'markdown'}});if(!r.ok)throw new Error('خطای سرور: '+r.status);const t=await r.text();if(!t||!t.trim())throw new Error('صفحه خالی بود.');const m=t.match(/^#\s+(.+)$/m);showResult(m?m[1]:'',u,t);}catch(err){showError(err.message||'خطای ناشناخته.');}finally{setLoading(false);}});function copyMarkdown(){navigator.clipboard.writeText(rawMarkdown.value).then(()=>{const b=event.target.closest('.action-btn');const o=b.textContent;b.textContent='✅ کپی شد!';setTimeout(()=>b.textContent=o,2000);});}function downloadMarkdown(){const b=new Blob([rawMarkdown.value],{type:'text/markdown'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='article.md';a.click();URL.revokeObjectURL(a.href);}const p=new URLSearchParams(window.location.search).get('url');if(p){urlInput.value=p;form.dispatchEvent(new Event('submit'));}</script></body></html>
