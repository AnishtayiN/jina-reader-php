<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Jina Reader — تبدیل وب به Markdown</title>
<meta name="description" content="تبدیل هر صفحه وب به Markdown تمیز و خوانا">
<meta name="theme-color" content="#0f0f23">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="styles.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
<div id="progressBar"></div>

<div class="container">
  <header>
    <div class="topbar">
      <button id="themeToggle" class="icon-btn" title="تغییر تم">🌙</button>
      <button id="tocToggle" class="icon-btn" title="فهرست مطالب" style="display:none">📑</button>
      <button id="bookmarksBtn" class="icon-btn" title="نشانک‌ها">⭐</button>
      <button id="statsBtn" class="icon-btn" title="آمار مطالعه">📊</button>
      <button id="historyBtn" class="icon-btn" title="تاریخچه">🕘</button>
      <button id="focusBtn" class="icon-btn" title="حالت تمرکز">🎯</button>
    </div>
    <div class="logo">
      <span class="logo-icon">📖</span>
      <h1>Jina Reader</h1>
    </div>
    <p class="subtitle">تبدیل هر صفحه وب به Markdown تمیز و خوانا</p>
  </header>

  <div class="card">
    <form id="readerForm">
      <div class="label-row">
        <label for="urlInput">آدرس صفحه وب</label>
        <button type="button" id="batchToggle" class="link-btn">🌐 چندتا با هم</button>
      </div>
      <div class="input-group" id="singleGroup">
        <input type="url" id="urlInput" placeholder="https://example.com" required autocomplete="url">
        <button type="submit" id="submitBtn">
          <span class="btn-text">تبدیل</span>
          <span class="btn-loading" style="display:none"><svg class="spinner" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3" fill="none" stroke-dasharray="31.4 31.4" stroke-linecap="round"/></svg> در حال خواندن...</span>
        </button>
      </div>
      <div class="batch-group" id="batchGroup" style="display:none">
        <textarea id="batchUrls" rows="5" placeholder="هر آدرس در یک خط وارد کنید..."></textarea>
        <button type="button" id="batchSubmitBtn">⚡ تبدیل همه (موازی)</button>
      </div>
      <div class="history-chips" id="historyChips" style="display:none"></div>
      <div class="bookmarks-panel" id="bookmarksPanel" style="display:none">
        <div class="bookmarks-header">
          <span>⭐ نشانک‌ها</span>
          <button class="link-btn" id="clearBookmarks">پاک کردن همه</button>
        </div>
        <input type="text" id="bookmarkSearch" placeholder="جستجو...">
        <div id="bookmarksList"></div>
      </div>
      <div class="stats-panel" id="statsPanel" style="display:none">
        <div class="stats-title">📊 آمار مطالعه</div>
        <div id="statsContent"></div>
      </div>
    </form>
  </div>

  <div id="resultSection" class="card result-card" style="display:none">
    <div class="result-header">
      <h2 id="resultTitle"></h2>
      <div class="result-actions">
        <button class="action-btn" id="openBtn">🔗 لینک اصلی</button>
        <button class="action-btn" id="copyBtn">📋 کپی</button>
        <button class="action-btn" id="downloadBtn">⬇️ دانلود</button>
        <button class="action-btn" id="pdfBtn">🖨 PDF</button>
        <button class="action-btn" id="shareBtn">↗️ اشتراک</button>
      </div>
    </div>
    <div class="result-meta">
      <span id="resultUrl"></span>
      <span id="resultTime"></span>
      <span id="resultStats"></span>
    </div>

    <div class="reader-layout">
      <aside class="toc-panel" id="tocPanel" style="display:none">
        <div class="toc-title">📑 فهرست مطالب</div>
        <nav id="tocNav"></nav>
      </aside>

      <div class="article-col">
        <div class="article-toolbar">
          <button class="tool-btn" id="searchBtn" title="جستجو در متن">🔍 جستجو</button>
          <span class="tool-sep"></span>
          <button class="tool-btn" id="ttsBtn" title="خواندن صوتی">🔊 خواندن</button>
          <span class="tool-sep"></span>
          <button class="tool-btn" id="tldrBtn" title="خلاصه هوشمند">🤖 TL;DR</button>
          <span class="tool-sep"></span>
          <button class="tool-btn" id="bookmarkBtn" title="نشانک‌گذاری">⭐ نشانک</button>
          <span class="tool-sep"></span>
          <button class="tool-btn" id="highlightBtn" title="هایلایت متن (انتخاب کنید)">🖍 هایلایت</button>
          <span class="tool-sep"></span>
          <span class="font-group">
            <button class="tool-btn" id="fontMinus" title="کوچک‌تر">A−</button>
            <button class="tool-btn" id="fontPlus" title="بزرگ‌تر">A+</button>
          </span>
        </div>
        <div id="tldrBox" class="tldr-box" style="display:none"></div>
        <div class="search-bar" id="searchBar" style="display:none">
          <input type="text" id="searchInput" placeholder="جستجو در متن...">
          <span id="searchCount"></span>
          <button class="tool-btn" id="searchClose">✕</button>
        </div>
        <article class="markdown-preview" id="markdownOutput"></article>
      </div>
    </div>

    <details class="raw-wrap">
      <summary>نمایش Markdown خام</summary>
      <textarea id="rawMarkdown" class="raw-textarea" readonly></textarea>
    </details>
  </div>

  <div id="batchResultsSection" class="card" style="display:none">
    <div class="batch-results-header">
      <h2>📚 نتایج دسته‌ای</h2>
      <button class="action-btn" id="batchDownloadBtn">⬇️ دانلود همه (ZIP)</button>
    </div>
    <div id="batchResults"></div>
  </div>

  <div id="errorSection" class="card error-card" style="display:none">
    <span class="error-icon">⚠️</span>
    <p id="errorMessage"></p>
  </div>

  <footer>
    <p>ساخته شده با ❤️ | قدرت‌گرفته از <a href="https://jina.ai/reader" target="_blank">Jina AI Reader</a></p>
    <p><a href="https://github.com/AnishtayiN/jina-reader-php" target="_blank">📂 سورس‌کد</a></p>
  </footer>
</div>

<script>
const $=id=>document.getElementById(id);
const form=$('readerForm'),urlInput=$('urlInput'),submitBtn=$('submitBtn');
const batchToggle=$('batchToggle'),batchGroup=$('batchGroup'),batchSubmitBtn=$('batchSubmitBtn'),batchUrls=$('batchUrls');
const resultSection=$('resultSection'),errorSection=$('errorSection');
const resultTitle=$('resultTitle'),resultUrl=$('resultUrl'),resultTime=$('resultTime'),resultStats=$('resultStats');
const markdownOutput=$('markdownOutput'),rawMarkdown=$('rawMarkdown'),errorMessage=$('errorMessage');
const openBtn=$('openBtn'),copyBtn=$('copyBtn'),downloadBtn=$('downloadBtn'),pdfBtn=$('pdfBtn'),shareBtn=$('shareBtn');
const themeToggle=$('themeToggle'),historyBtn=$('historyBtn'),historyChips=$('historyChips');
const bookmarksBtn=$('bookmarksBtn'),bookmarksPanel=$('bookmarksPanel'),clearBookmarks=$('clearBookmarks'),bookmarkSearch=$('bookmarkSearch'),bookmarksList=$('bookmarksList');
const statsBtn=$('statsBtn'),statsPanel=$('statsPanel'),statsContent=$('statsContent');
const focusBtn=$('focusBtn');
const tldrBtn=$('tldrBtn'),bookmarkBtn=$('bookmarkBtn'),highlightBtn=$('highlightBtn'),tldrBox=$('tldrBox');
const tocToggle=$('tocToggle'),tocPanel=$('tocPanel'),tocNav=$('tocNav');
const searchBtn=$('searchBtn'),searchBar=$('searchBar'),searchInput=$('searchInput'),searchCount=$('searchCount'),searchClose=$('searchClose');
const ttsBtn=$('ttsBtn'),fontMinus=$('fontMinus'),fontPlus=$('fontPlus');
const progressBar=$('progressBar');
const batchResultsSection=$('batchResultsSection'),batchResults=$('batchResults'),batchDownloadBtn=$('batchDownloadBtn');
let currentUrl='';
let tocItems=[];
let speaking=false;
let batchArticles=[];

function esc(t){const d=document.createElement('div');d.textContent=t;return d.innerHTML;}
function escAttr(t){return esc(t).replace(/"/g,'&quot;');}
function stripMd(t){return t.replace(/[*_`~#]+/g,'').replace(/\[([^\]]+)\]\([^)]+\)/g,'$1').replace(/&amp;/g,'&').trim();}
function slug(t){return (t||'').replace(/[^\w\u0600-\u06FF]+/g,'-').replace(/^-+|-+$/g,'').slice(0,60)||'article';}
function cleanJina(md){
  let m=md;
  m=m.replace(/^Title:[^\n]*\n/m,'');
  m=m.replace(/^URL Source:[^\n]*\n/m,'');
  m=m.replace(/^Published Time:[^\n]*\n/m,'');
  m=m.replace(/^Markdown Content:\s*\n?/m,'');
  return m.replace(/^\s+/,'');
}

function applyTheme(t){
  document.documentElement.dataset.theme=t;
  themeToggle.textContent=t==='dark'?'🌙':'☀️';
  localStorage.setItem('jina-theme',t);
}
const savedTheme=localStorage.getItem('jina-theme');
if(savedTheme){applyTheme(savedTheme);}
else if(window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches){applyTheme('light');}
else{applyTheme('dark');}
themeToggle.onclick=()=>applyTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');

const HKEY='jina-history';
function getHistory(){try{return JSON.parse(localStorage.getItem(HKEY))||[]}catch(e){return[]}}
function pushHistory(u){const h=[u,...getHistory().filter(x=>x!==u)].slice(0,6);localStorage.setItem(HKEY,JSON.stringify(h));renderHistory();}
function renderHistory(){
  const h=getHistory();
  if(!h.length){historyChips.style.display='none';return;}
  historyChips.style.display='flex';
  historyChips.innerHTML='<span class="hint">آخرین‌ها:</span>'+h.map(u=>`<button type="button" class="chip" data-url="${escAttr(u)}">${esc(u)}</button>`).join('');
  historyChips.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{urlInput.value=c.dataset.url;form.requestSubmit();});
}
historyBtn.onclick=()=>{historyChips.style.display=historyChips.style.display==='none'?'flex':'none';};

const singleGroup=$('singleGroup');
batchToggle.onclick=()=>{
  const batchMode=batchGroup.style.display==='none';
  singleGroup.style.display=batchMode?'none':'flex';
  batchGroup.style.display=batchMode?'flex':'none';
  batchToggle.textContent=batchMode?'☝️ تکی':'🌐 چندتا با هم';
  if(batchMode)batchUrls.focus();
};

function inlineMd(t){
  let s=t;
  s=s.replace(/`([^`]+)`/g,'<code>$1</code>');
  s=s.replace(/\*\*\*(.+?)\*\*\*/g,'<strong><em>$1</em></strong>');
  s=s.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  s=s.replace(/\*(.+?)\*/g,'<em>$1</em>');
  s=s.replace(/~~(.+?)~~/g,'<del>$1</del>');
  s=s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g,'<img src="$2" alt="$1" loading="lazy">');
  s=s.replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  return s;
}

function render(md){
  tocItems=[];
  const codeBlocks=[];
  let h=esc(md);
  h=h.replace(/```(\w*)\n([\s\S]*?)```/g,function(_,lang,code){codeBlocks.push({lang:lang,code:code});return '\u0000C'+(codeBlocks.length-1)+'\u0000';});
  h=h.replace(/(^\|.+\|[ \t]*$\n)(\|[\s:|-]+\|[ \t]*$\n)((?:^\|.+\|[ \t]*$\n?)+)/gm,function(m,head,sep,body){
    const ths=head.replace(/^\||\|[ \t]*$/g,'').split('|').map(c=>`<th>${inlineMd(c.trim())}</th>`).join('');
    const trs=body.trim().split('\n').map(r=>{const cs=r.replace(/^\||\|[ \t]*$/g,'').split('|');return '<tr>'+cs.map(c=>`<td>${inlineMd(c.trim())}</td>`).join('')+'</tr>';}).join('');
    return '<div class="table-wrap"><table><thead><tr>'+ths+'</tr></thead><tbody>'+trs+'</tbody></table></div>';
  });
  h=h.replace(/^(#{1,3})\s+(.+)$/gm,function(m,hs,t){const lvl=hs.length;const id='sec-'+tocItems.length;tocItems.push({lvl:lvl,text:stripMd(t)});return `<h${lvl} id="${id}">${inlineMd(t)}</h${lvl}>`;});
  h=h.replace(/^---+$/gm,'<hr>');
  h=h.replace(/^&gt;\s*(.+)$/gm,'<blockquote>$1</blockquote>');
  h=h.replace(/^(\s*)[-*+] \[([ xX])\]\s+(.+)$/gm,function(m,ws,chk,t){return ws+'<label class="task"><input type="checkbox" disabled'+(chk.toLowerCase()==='x'?' checked':'')+'>'+inlineMd(t)+'</label>';});
  h=h.replace(/^(\s*)[-*+] (.+)$/gm,'$1<span class="li">• $2</span>');
  h=h.replace(/^(\s*)(\d+)\. (.+)$/gm,'$1<span class="li">$2. $3</span>');
  h=h.replace(/\n\n+/g,'</p><p>');
  h=h.replace(/\n/g,'<br>');
  h=h.replace(/\u0000C(\d+)\u0000/g,function(_,i){const b=codeBlocks[+i];return `<pre data-lang="${b.lang}"><code>${b.code}</code></pre>`;});
  return '<p>'+h+'</p>';
}

function stats(md){
  const words=md.trim().split(/\s+/).filter(Boolean).length;
  const chars=md.length;
  const min=Math.max(1,Math.round(words/200));
  return `📊 ${words.toLocaleString('fa-IR')} کلمه · ${chars.toLocaleString('fa-IR')} کاراکتر · ⏱ ${min} دقیقه مطالعه`;
}

function renderToc(){
  if(!tocItems.length){tocToggle.style.display='none';tocPanel.style.display='none';tocToggle.classList.remove('active');return;}
  tocToggle.style.display='flex';
  tocPanel.style.display='none';
  tocToggle.classList.remove('active');
  tocNav.innerHTML=tocItems.map((it,i)=>`<a href="#sec-${i}" data-target="sec-${i}" class="toc-item toc-${it.lvl}">${it.text}</a>`).join('');
}
tocNav.addEventListener('click',e=>{
  const a=e.target.closest('a');if(!a)return;
  e.preventDefault();
  const el=document.getElementById(a.dataset.target);
  if(el)el.scrollIntoView({behavior:'smooth',block:'start'});
});
tocToggle.onclick=()=>{
  const hidden=tocPanel.style.display==='none';
  tocPanel.style.display=hidden?'block':'none';
  tocToggle.classList.toggle('active',hidden);
};

function clearHighlights(){
  markdownOutput.querySelectorAll('.hl').forEach(s=>{const p=s.parentNode;p.replaceChild(document.createTextNode(s.textContent),s);p.normalize();});
}
searchBtn.onclick=()=>{
  const hidden=searchBar.style.display==='none';
  searchBar.style.display=hidden?'flex':'none';
  if(hidden){searchInput.focus();}else{searchInput.value='';searchCount.textContent='';clearHighlights();}
};
searchClose.onclick=()=>{searchBar.style.display='none';searchInput.value='';searchCount.textContent='';clearHighlights();};
searchInput.addEventListener('input',()=>{
  clearHighlights();
  const q=searchInput.value.trim();
  if(!q){searchCount.textContent='';return;}
  const walker=document.createTreeWalker(markdownOutput,NodeFilter.SHOW_TEXT);
  const nodes=[];let n;
  while(n=walker.nextNode())nodes.push(n);
  let count=0;
  nodes.forEach(node=>{
    const t=node.nodeValue||'';
    const idx=t.toLowerCase().indexOf(q.toLowerCase());
    if(idx>=0){
      count++;
      const span=document.createElement('span');
      span.className='hl';
      span.textContent=t.substr(idx,q.length);
      const rest=node.splitText(idx);
      rest.splitText(q.length);
      rest.parentNode.replaceChild(span,rest.previousSibling);
    }
  });
  searchCount.textContent=count?count+' مورد':'یافت نشد';
});

function setSpeaking(s){speaking=s;ttsBtn.classList.toggle('active',s);ttsBtn.textContent=s?'⏹ توقف':'🔊 خواندن';}
ttsBtn.onclick=()=>{
  if(!('speechSynthesis' in window)){return;}
  if(speaking){speechSynthesis.cancel();setSpeaking(false);return;}
  const plain=stripMd(rawMarkdown.value).replace(/\n{2,}/g,'. ').replace(/\n/g,' ').replace(/\s{2,}/g,' ');
  if(!plain){return;}
  const u=new SpeechSynthesisUtterance(plain);
  u.lang='fa-IR';u.rate=1;
  u.onend=u.onerror=()=>setSpeaking(false);
  setSpeaking(true);
  speechSynthesis.speak(u);
};

let fontDelta=parseInt(localStorage.getItem('jina-font')||'0',10)||0;
function applyFont(){markdownOutput.style.fontSize=(0.95+fontDelta*0.08)+'rem';localStorage.setItem('jina-font',fontDelta);}
applyFont();
fontMinus.onclick=()=>{fontDelta=Math.max(-3,fontDelta-1);applyFont();};
fontPlus.onclick=()=>{fontDelta=Math.min(6,fontDelta+1);applyFont();};

window.addEventListener('scroll',()=>{
  const de=document.documentElement;
  const p=de.scrollTop/((de.scrollHeight-de.clientHeight)||1);
  progressBar.style.width=Math.min(100,p*100)+'%';
},{passive:true});

function setLoading(l){
  submitBtn.querySelector('.btn-text').style.display=l?'none':'inline';
  submitBtn.querySelector('.btn-loading').style.display=l?'inline-flex':'none';
  submitBtn.disabled=l;
}
function showError(m){resultSection.style.display='none';errorSection.style.display='flex';errorMessage.textContent=m;}
function showResult(t,u,md){
  errorSection.style.display='none';
  resultSection.style.display='block';
  currentUrl=u;
  resultTitle.textContent=t||'بدون عنوان';
  resultUrl.textContent='🔗 '+u;
  resultUrl.title=u;
  resultTime.textContent='🕐 '+new Date().toLocaleString('fa-IR');
  resultStats.textContent=stats(md);
  markdownOutput.innerHTML=render(md);
  renderToc();
  rawMarkdown.value=md;
  resultSection.scrollIntoView({behavior:'smooth'});
  searchBar.style.display='none';searchInput.value='';searchCount.textContent='';clearHighlights();
  setSpeaking(false);if('speechSynthesis' in window)speechSynthesis.cancel();
  tldrBox.style.display='none';
  const words=md.trim().split(/\s+/).filter(Boolean).length;
  trackRead(words);
  const b=getBookmarks();
  bookmarkBtn.textContent=b.find(x=>x.url===u)?'★ نشانک‌شده':'⭐ نشانک';
}

form.addEventListener('submit',async e=>{
  e.preventDefault();
  const u=urlInput.value.trim();
  if(!u)return;
  setLoading(true);
  resultSection.style.display='none';errorSection.style.display='none';
  try{
    const r=await fetch('https://r.jina.ai/'+u,{headers:{'Accept':'text/markdown','X-Return-Format':'markdown'}});
    if(!r.ok)throw new Error('خطای سرور: '+r.status);
    const t=await r.text();
    if(!t||!t.trim())throw new Error('صفحه خالی بود.');
    const clean=cleanJina(t);
    if(!clean.trim())throw new Error('صفحه خالی بود.');
    const titleMatch=t.match(/^Title:\s*(.+)$/m)||t.match(/^#\s+(.+)$/m);
    showResult(titleMatch?stripMd(titleMatch[1].trim()):'',u,clean);
    pushHistory(u);
  }catch(err){
    showError(err.message||'خطای ناشناخته.');
  }finally{setLoading(false);}
});

copyBtn.onclick=async()=>{
  await navigator.clipboard.writeText(rawMarkdown.value);
  const o=copyBtn.textContent;copyBtn.textContent='✅ کپی شد!';
  setTimeout(()=>copyBtn.textContent=o,2000);
};
downloadBtn.onclick=()=>{
  const b=new Blob([rawMarkdown.value],{type:'text/markdown;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(b);
  a.download=slug(resultTitle.textContent)+'.md';
  a.click();
  URL.revokeObjectURL(a.href);
};
openBtn.onclick=()=>{if(currentUrl)window.open(currentUrl,'_blank');};

pdfBtn.onclick=()=>{
  const w=window.open('','_blank');
  if(!w){showError('مرورگر پنجره جدید را بست. اجازه popup بدهید.');return;}
  const html=`<!DOCTYPE html><html dir="rtl" lang="fa"><head><meta charset="UTF-8"><title>${esc(resultTitle.textContent)}</title>
  <style>body{font-family:Vazirmatn,Tahoma,sans-serif;max-width:800px;margin:0 auto;padding:2rem;line-height:1.8;color:#111}
  h1,h2,h3{color:#0066aa}img{max-width:100%}code{background:#f0f0f0;padding:.15rem .4rem;border-radius:4px}
  pre{background:#f6f6f6;padding:1rem;border-radius:8px;overflow-x:auto;direction:ltr;text-align:left}
  table{border-collapse:collapse;width:100%}td,th{border:1px solid #ccc;padding:.4rem .6rem;text-align:left;direction:ltr}
  a{color:#0066aa}.meta{color:#666;font-size:.85rem;border-bottom:1px solid #ddd;padding-bottom:1rem;margin-bottom:1rem}</style></head>
  <body><h1>${esc(resultTitle.textContent)}</h1><p class="meta">${esc(currentUrl)}</p>${markdownOutput.innerHTML}</body></html>`;
  w.document.write(html);w.document.close();
  setTimeout(()=>{w.focus();w.print();},400);
};

shareBtn.onclick=async()=>{
  const shareData={title:resultTitle.textContent,url:currentUrl||location.href,text:rawMarkdown.value.slice(0,300)};
  try{
    if(navigator.share){await navigator.share(shareData);}
    else{await navigator.clipboard.writeText(currentUrl||location.href);shareBtn.textContent='✅ لینک کپی شد!';setTimeout(()=>shareBtn.textContent='↗️ اشتراک',2000);}
  }catch(e){/* user cancelled */}
};

document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();urlInput.focus();urlInput.select();}
  else if(e.key==='Escape'){if(searchBar.style.display!=='none'){searchClose.onclick();}}
});

function normalizeUrl(u){u=u.trim();if(!u)return'';if(!/^https?:\/\//i.test(u))u='https://'+u;return u;}
async function fetchArticle(u){
  const r=await fetch('https://r.jina.ai/'+u,{headers:{'Accept':'text/markdown','X-Return-Format':'markdown'}});
  if(!r.ok)throw new Error('خطای سرور: '+r.status);
  const t=await r.text();
  if(!t||!t.trim())throw new Error('صفحه خالی بود.');
  const clean=cleanJina(t);
  if(!clean.trim())throw new Error('صفحه خالی بود.');
  const titleMatch=t.match(/^Title:\s*(.+)$/m)||t.match(/^#\s+(.+)$/m);
  return {title:titleMatch?stripMd(titleMatch[1].trim()):u,url:u,markdown:clean};
}
function renderBatch(){
  if(!batchArticles.length){batchResultsSection.style.display='none';return;}
  batchResultsSection.style.display='block';
  batchResults.innerHTML=batchArticles.map((a,i)=>{
    const ok=a.error?'':`<div class="batch-art-actions"><button class="tool-btn" data-copy="${i}">📋 کپی</button><button class="tool-btn" data-dl="${i}">⬇️ md</button></div>`;
    return `<div class="batch-art ${a.error?'batch-art-err':''}">
      <div class="batch-art-head"><span class="batch-art-idx">${i+1}</span><strong>${esc(a.error?'خطا':a.title)}</strong></div>
      <div class="batch-art-url">${esc(a.url)}</div>
      ${a.error?`<div class="batch-art-msg">${esc(a.error)}</div>`:ok}
    </div>`;
  }).join('');
  batchResults.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>navigator.clipboard.writeText(batchArticles[+b.dataset.copy].markdown));
  batchResults.querySelectorAll('[data-dl]').forEach(b=>{
    b.onclick=()=>{
      const a=batchArticles[+b.dataset.dl];
      const bl=new Blob([a.markdown],{type:'text/markdown;charset=utf-8'});
      const x=document.createElement('a');x.href=URL.createObjectURL(bl);x.download=slug(a.title)+'.md';x.click();URL.revokeObjectURL(x.href);
    };
  });
}
function storeZip(files){
  const enc=new TextEncoder();
  const parts=[];const central=[];let offset=0;
  function crc32(buf){
    let table=crc32.table;
    if(!table){table=crc32.table=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?(c>>>1)^0xEDB88320:(c>>>1);table[n]=c>>>0;}}
    let crc=0xFFFFFFFF;
    for(let i=0;i<buf.length;i++)crc=(crc>>>8)^table[(crc^buf[i])&0xFF];
    return (crc^0xFFFFFFFF)>>>0;
  }
  const now=new Date();
  const dosTime=(now.getHours()<<11)|(now.getMinutes()<<5)|(now.getSeconds()>>1);
  const dosDate=((now.getFullYear()-1980)<<9)|((now.getMonth()+1)<<5)|now.getDate();
  files.forEach(f=>{
    const name=enc.encode(f.name),data=enc.encode(f.content),crc=crc32(data);
    const lh=new Uint8Array(30);
    const dv=new DataView(lh.buffer);
    dv.setUint32(0,0x04034b50,true);dv.setUint16(4,20,true);dv.setUint16(6,0x0800,true);
    dv.setUint16(8,0,true);dv.setUint16(10,dosTime,true);dv.setUint16(12,dosDate,true);
    dv.setUint32(14,crc,true);dv.setUint32(18,data.length,true);dv.setUint32(22,data.length,true);
    dv.setUint16(26,name.length,true);dv.setUint16(28,0,true);
    parts.push(lh,name,data);
    const ch=new Uint8Array(46);
    const cv=new DataView(ch.buffer);
    cv.setUint32(0,0x02014b50,true);cv.setUint16(4,20,true);cv.setUint16(6,20,true);
    cv.setUint16(8,0x0800,true);cv.setUint16(10,0,true);cv.setUint16(12,dosTime,true);cv.setUint16(14,dosDate,true);
    cv.setUint32(16,crc,true);cv.setUint32(20,data.length,true);cv.setUint32(24,data.length,true);
    cv.setUint16(28,name.length,true);cv.setUint16(30,0,true);cv.setUint16(32,0,true);cv.setUint16(34,0,true);cv.setUint16(36,0,true);
    cv.setUint32(38,0,true);cv.setUint32(42,offset,true);
    central.push(ch,name);offset+=lh.length+name.length+data.length;
  });
  const cenSize=central.reduce((s,c)=>s+c.length,0);
  const end=new Uint8Array(22);
  const ev=new DataView(end.buffer);
  ev.setUint32(0,0x06054b50,true);ev.setUint16(4,0,true);ev.setUint16(6,0,true);
  ev.setUint16(8,files.length,true);ev.setUint16(10,files.length,true);
  ev.setUint32(12,cenSize,true);ev.setUint32(16,offset,true);ev.setUint16(20,0,true);
  return new Blob([...parts,...central,end],{type:'application/zip'});
}
batchDownloadBtn.onclick=()=>{
  const ok=batchArticles.filter(a=>!a.error);
  if(!ok.length)return;
  const used=new Set();
  const files=ok.map(a=>{
    let base=slug(a.title).slice(0,40)||'article';
    let name=base+'.md',n=1;
    while(used.has(name)){name=base+'-'+(n++)+'.md';}
    used.add(name);
    return {name:name,content:a.markdown};
  });
  const bl=storeZip(files);
  const x=document.createElement('a');x.href=URL.createObjectURL(bl);x.download='jina-reader-articles.zip';x.click();URL.revokeObjectURL(x.href);
};
async function runBatch(urls){
  setLoading(true);
  batchResultsSection.style.display='block';
  batchResults.innerHTML='<div class="batch-loading">⏳ در حال خواندن '+urls.length+' صفحه به صورت موازی...</div>';
  batchArticles=await Promise.all(urls.map(async u=>{
    try{const a=await fetchArticle(u);pushHistory(u);return a;}
    catch(e){return {title:u,url:u,error:e.message||'خطای ناشناخته.'};}
  }));
  renderBatch();
  setLoading(false);
}
batchSubmitBtn.onclick=e=>{
  e.preventDefault();
  const urls=batchUrls.value.split('\n').map(normalizeUrl).filter(Boolean);
  if(!urls.length){showError('حداقل یک آدرس وارد کنید.');return;}
  errorSection.style.display='none';resultSection.style.display='none';
  runBatch(urls);
};
form.addEventListener('submit',e=>{
  if(batchGroup.style.display!=='none'){e.preventDefault();batchSubmitBtn.onclick(e);}
});

const p=new URLSearchParams(window.location.search).get('url');
if(p){urlInput.value=p;form.dispatchEvent(new Event('submit'));}

// Bookmarks
const BMKEY='jina-bookmarks';
function getBookmarks(){try{return JSON.parse(localStorage.getItem(BMKEY))||[]}catch{return[]}}
function saveBookmarks(b){localStorage.setItem(BMKEY,JSON.stringify(b));}
function renderBookmarks(filter=''){
  const b=getBookmarks();
  const q=filter.toLowerCase();
  const filtered=q?b.filter(x=>x.title.toLowerCase().includes(q)||x.url.toLowerCase().includes(q)||(x.note||'').toLowerCase().includes(q)):b;
  if(!filtered.length){bookmarksList.innerHTML='<div class="bm-empty">نشانکی نیست.</div>';return;}
  bookmarksList.innerHTML=filtered.map((x,i)=>`<div class="bm-item" data-idx="${b.indexOf(x)}">
    <div class="bm-head"><strong>${esc(x.title)}</strong><button class="bm-del" data-del="${b.indexOf(x)}">✕</button></div>
    <div class="bm-url">${esc(x.url)}</div>
    ${x.note?`<div class="bm-note">${esc(x.note)}</div>`:''}
    <div class="bm-date">${new Date(x.date).toLocaleDateString('fa-IR')}</div>
  </div>`).join('');
  bookmarksList.querySelectorAll('[data-idx]').forEach(el=>{
    el.onclick=e=>{if(e.target.classList.contains('bm-del'))return;const x=b[+el.dataset.idx];urlInput.value=x.url;form.requestSubmit();};
  });
  bookmarksList.querySelectorAll('[data-del]').forEach(b=>b.onclick=e=>{e.stopPropagation();const bm=getBookmarks();bm.splice(+b.dataset.del,1);saveBookmarks(bm);renderBookmarks(bookmarkSearch.value);});
}
bookmarksBtn.onclick=()=>{
  const show=bookmarksPanel.style.display==='none';
  bookmarksPanel.style.display=show?'block':'none';
  statsPanel.style.display='none';
  if(show){renderBookmarks();bookmarkSearch.value='';bookmarkSearch.focus();}
};
clearBookmarks.onclick=()=>{if(confirm('همه نشانک‌ها پاک شوند؟')){saveBookmarks([]);renderBookmarks();}};
bookmarkSearch.addEventListener('input',()=>renderBookmarks(bookmarkSearch.value));

// Stats
function updateStats(){
  const s=JSON.parse(localStorage.getItem('jina-stats')||'{"count":0,"words":0,"mins":0}');
  const b=getBookmarks().length;
  statsContent.innerHTML=`
    <div class="stat-row"><span>📚 مقالات خوانده‌شده:</span><strong>${s.count.toLocaleString('fa-IR')}</strong></div>
    <div class="stat-row"><span>📝 کلمات خوانده‌شده:</span><strong>${s.words.toLocaleString('fa-IR')}</strong></div>
    <div class="stat-row"><span>⏱ زمان مطالعه:</span><strong>${s.mins.toLocaleString('fa-IR')} دقیقه</strong></div>
    <div class="stat-row"><span>⭐ نشانک‌ها:</span><strong>${b.toLocaleString('fa-IR')}</strong></div>
  `;
}
function trackRead(words){
  const s=JSON.parse(localStorage.getItem('jina-stats')||'{"count":0,"words":0,"mins":0}');
  s.count++;s.words+=words;s.mins+=Math.max(1,Math.round(words/200));
  localStorage.setItem('jina-stats',JSON.stringify(s));
}
statsBtn.onclick=()=>{
  const show=statsPanel.style.display==='none';
  statsPanel.style.display=show?'block':'none';
  bookmarksPanel.style.display='none';
  if(show)updateStats();
};

// Focus mode
let focusMode=false;
focusBtn.onclick=()=>{
  focusMode=!focusMode;
  document.body.classList.toggle('focus-mode',focusMode);
  focusBtn.classList.toggle('active',focusMode);
};

// Bookmark current article
bookmarkBtn.onclick=()=>{
  if(!currentUrl)return;
  const b=getBookmarks();
  if(b.find(x=>x.url===currentUrl)){bookmarkBtn.textContent='⭐ نشانک';alert('این مقاله قبلاً نشانک شده.');return;}
  const note=prompt('یادداشت اختیاری:');
  b.unshift({title:resultTitle.textContent||'بدون عنوان',url:currentUrl,note:note||'',date:Date.now()});
  saveBookmarks(b);
  bookmarkBtn.textContent='✅ نشانک شد';
  setTimeout(()=>bookmarkBtn.textContent='⭐ نشانک',2000);
};

// TL;DR with Jina
tldrBtn.onclick=async()=>{
  if(!currentUrl){alert('ابتدا یک مقاله بخوانید.');return;}
  tldrBox.style.display='block';
  tldrBox.innerHTML='<div class="tldr-loading">🤖 در حال تولید خلاصه...</div>';
  try{
    const r=await fetch('https://r.jina.ai/'+currentUrl,{headers:{'Accept':'application/json','X-Locale':'fa_IR','X-With-Links-Summary':'true','X-Return-Format':'text'}});
    if(!r.ok)throw new Error('خطا');
    const t=await r.text();
    const summary=t.slice(0,800).replace(/\n+/g,'<br>');
    tldrBox.innerHTML='<div class="tldr-title">🤖 خلاصه هوشمند</div><div class="tldr-text">'+summary+'...</div>';
  }catch{tldrBox.innerHTML='<div class="tldr-err">خطا در تولید خلاصه.</div>';}
};

// Highlighter
let highlightMode=false;
highlightBtn.onclick=()=>{
  highlightMode=!highlightMode;
  highlightBtn.classList.toggle('active',highlightMode);
  if(highlightMode)markdownOutput.style.cursor='text';
  else markdownOutput.style.cursor='default';
};
markdownOutput.addEventListener('mouseup',()=>{
  if(!highlightMode)return;
  const sel=window.getSelection();
  if(!sel.rangeCount||sel.isCollapsed)return;
  const range=sel.getRangeAt(0);
  if(!markdownOutput.contains(range.commonAncestorContainer))return;
  const span=document.createElement('span');
  span.className='user-hl';
  try{range.surroundContents(span);}catch{}
  sel.removeAllRanges();
});

if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});}

renderHistory();
</script>
