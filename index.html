<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jina Reader</title>
    <style>
        *{box-sizing:border-box;margin:0;padding:0}
        body{font-family:Segoe UI,Tahoma,sans-serif;background:linear-gradient(135deg,#1a1a2e,#16213e,#0f3460);min-height:100vh;color:#e0e0e0;padding:2rem 1rem}
        .container{max-width:900px;margin:0 auto}
        h1{text-align:center;font-size:2.5rem;margin-bottom:.5rem;background:linear-gradient(90deg,#00d2ff,#3a7bd5);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        .subtitle{text-align:center;color:#888;margin-bottom:2rem}
        .card{background:rgba(255,255,255,.05);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:2rem;margin-bottom:1.5rem}
        label{display:block;margin-bottom:.5rem;font-weight:bold}
        .input-row{display:flex;gap:.5rem}
        input[type=url]{flex:1;padding:.9rem 1rem;font-size:1rem;background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.2);border-radius:8px;color:#fff;direction:ltr;text-align:left}
        input[type=url]:focus{outline:none;border-color:#3a7bd5}
        button{padding:.9rem 1.5rem;font-size:1rem;background:linear-gradient(90deg,#00d2ff,#3a7bd5);color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:bold}
        button:hover{opacity:.9}button:disabled{opacity:.5;cursor:not-allowed}
        .output{background:#0a0a0a;border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:1.5rem;white-space:pre-wrap;word-wrap:break-word;font-family:Courier New,monospace;font-size:.9rem;color:#b8f2e6;max-height:600px;overflow-y:auto;direction:ltr;text-align:left;display:none}
        .toolbar{display:flex;gap:.5rem;margin-bottom:.75rem}
        .toolbar button{padding:.5rem 1rem;font-size:.85rem}
        .examples{margin-top:1rem}
        .examples a{color:#00d2ff;text-decoration:none;margin-left:1rem;cursor:pointer}
        .examples a:hover{text-decoration:underline}
        .error{color:#ff6b6b;margin-top:.75rem}
        footer{text-align:center;margin-top:2rem;color:#666}
        footer a{color:#00d2ff;text-decoration:none}
    </style>
</head>
<body>
    <div class="container">
        <h1>Jina Reader</h1>
        <p class="subtitle">Convert any web page to clean Markdown</p>
        <div class="card">
            <label for="url">URL</label>
            <div class="input-row">
                <input type="url" id="url" placeholder="https://example.com">
                <button id="goBtn" onclick="fetchMarkdown()">Convert</button>
            </div>
            <div class="examples">
                Examples:
                <a onclick="setUrl('https://en.wikipedia.org/wiki/Main_Page')">Wikipedia</a>
                <a onclick="setUrl('https://github.com')">GitHub</a>
                <a onclick="setUrl('https://news.ycombinator.com')">HN</a>
            </div>
            <div id="error" class="error"></div>
        </div>
        <div class="card" id="resultCard" style="display:none">
            <div class="toolbar">
                <button onclick="copyOutput()">Copy</button>
                <button onclick="downloadOutput()">Download</button>
                <button onclick="clearOutput()">Clear</button>
            </div>
            <pre class="output" id="output" style="display:block"></pre>
        </div>
        <footer>Made with love by <a href="https://github.com/AnishtayiN">AnishtayiN</a></footer>
    </div>
    <script>
        const API="https://r.jina.ai/";
        function setUrl(u){document.getElementById("url").value=u}
        async function fetchMarkdown(){
            const u=document.getElementById("url").value.trim(),e=document.getElementById("error"),o=document.getElementById("output"),c=document.getElementById("resultCard"),b=document.getElementById("goBtn");
            e.textContent="";if(!u){e.textContent="Enter URL";return}
            try{new URL(u)}catch{e.textContent="Invalid URL";return}
            b.disabled=true;b.textContent="...";c.style.display="block";o.textContent="Loading...";
            try{const r=await fetch(API+u,{headers:{Accept:"text/markdown"}});if(!r.ok)throw new Error("HTTP "+r.status);o.textContent=await r.text()}
            catch(x){o.textContent="Error: "+x.message}
            finally{b.disabled=false;b.textContent="Convert"}}
        function copyOutput(){navigator.clipboard.writeText(document.getElementById("output").textContent).then(()=>alert("Copied!"))}
        function downloadOutput(){const t=document.getElementById("output").textContent,b=new Blob([t],{type:"text/markdown"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="article.md";a.click()}
        function clearOutput(){document.getElementById("output").textContent="";document.getElementById("resultCard").style.display="none"}
        document.getElementById("url").addEventListener("keypress",e=>{if(e.key==="Enter")fetchMarkdown()})
    </script>
</body>
</html>
